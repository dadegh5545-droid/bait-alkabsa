<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>لا يوجد اتصال | بيت الكبسة</title>
  <link rel="stylesheet" href="css/styles.css" />
  <style>
    .offline-page {
      min-height: 100svh;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 2rem;
      background:
        radial-gradient(ellipse 70% 55% at 78% 18%, rgba(200, 153, 47, .28), transparent 62%),
        linear-gradient(160deg, #4a2d18 0%, #3b2415 45%, #24150c 100%);
      color: #fff;
    }
    .offline-page .box { max-width: 440px; }
    .offline-page .icon { font-size: 4.5rem; margin-bottom: 1rem; }
    .offline-page h1 { font-family: 'Amiri', serif; font-size: 2.2rem; margin-bottom: .8rem; }
    .offline-page p { color: rgba(255,255,255,.78); margin-bottom: 2rem; }
  </style>
</head>
<body>
  <main class="offline-page">
    <div class="box">
      <div class="icon" aria-hidden="true">📡</div>
      <h1>لا يوجد اتصال بالإنترنت</h1>
      <p>
        يبدو أن جهازك غير متصل. تأكّد من الشبكة ثم أعد المحاولة —
        وستجد قائمتنا بانتظارك.
      </p>
      <button class="btn btn-primary btn-lg" onclick="location.reload()">إعادة المحاولة</button>
    </div>
  </main>
</body>
</html>
