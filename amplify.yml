version: 1
frontend:
  phases:
    build:
      commands:
        - echo "موقع ثابت — لا يحتاج خطوة بناء"
        # مجلد تطبيق الجوال لا يُنشر مع الموقع
        - rm -rf app
  artifacts:
    baseDirectory: /
    files:
      - '**/*'
  cache:
    paths: []
customHeaders:
  - pattern: '**/*'
    headers:
      - key: 'X-Content-Type-Options'
        value: 'nosniff'
      - key: 'X-Frame-Options'
        value: 'SAMEORIGIN'
      - key: 'Referrer-Policy'
        value: 'strict-origin-when-cross-origin'
  - pattern: '/sw.js'
    headers:
      - key: 'Cache-Control'
        value: 'no-cache, no-store, must-revalidate'
      - key: 'Service-Worker-Allowed'
        value: '/'
  - pattern: '/manifest.webmanifest'
    headers:
      - key: 'Content-Type'
        value: 'application/manifest+json; charset=utf-8'
      - key: 'Cache-Control'
        value: 'no-cache'
  - pattern: '/css/**'
    headers:
      - key: 'Cache-Control'
        value: 'public, max-age=31536000, immutable'
  - pattern: '/icons/**'
    headers:
      - key: 'Cache-Control'
        value: 'public, max-age=31536000, immutable'
